name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify workflow policy
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-workflows.ps1

  python:
    name: Python tests, Ruff, and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/uv.lock
      - name: Install uv
        run: python -m pip install uv==0.9.26
      - name: Install WQY CJK font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - name: Run pytest
        run: uv run --project server pytest
      - name: Run Ruff
        run: uv run --project server ruff check
      - name: Run mypy
        run: uv run --project server mypy server/src/makerseed_app

  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run JavaScript tests
        run: node --test tests/js/*.test.js

  static:
    name: Static site, Compose, and script verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/uv.lock
      - name: Verify static Pages entry
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-static-site.ps1
      - name: Verify Compose hardening
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-compose-security.ps1
      - name: Verify deployment scripts
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-deploy-scripts.ps1
      - name: Verify bootstrap preflight protocol
        run: sudo env MKSEED_EPHEMERAL_VOLUME1_TEST=1 sh tests/linux/verify-bootstrap-preflight.sh
      - name: Verify first-install admin protocol
        run: sudo env MKSEED_EPHEMERAL_VOLUME1_TEST=1 sh tests/linux/verify-first-install-admin.sh
      - name: Verify runtime Python entrypoints
        run: sh tests/linux/verify-runtime-python-entrypoints.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject committed secret material
        run: |
          git grep -n -I -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|ghp_[A-Za-z0-9_]{36,}|sk-[A-Za-z0-9]{20,})' -- . ':!server/uv.lock' ':!vendor/*' && exit 1 || status=$?
          if [ "$status" -ne 1 ]; then exit "$status"; fi

  docker-build:
    name: Docker build without push
    runs-on: ubuntu-latest
    needs: [python, node, static, policy, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: ghcr.io/liwlin/innovation-diagnostic-report-generator:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=ci
            COMMIT_SHA=${{ github.sha }}
